name: dayu
x-bot: &bot
  image: dayu:local
  build:
    context: .
    args:
      HTTP_PROXY: ${DAYU_PROXY:-}
      HTTPS_PROXY: ${DAYU_PROXY:-}
  user: "1000:1000"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  stop_grace_period: 30s
  pids_limit: 256
  mem_limit: 3g
  cpus: 2
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
  extra_hosts:
    - host.docker.internal:host-gateway
  environment: &environment
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    HTTP_PROXY: ${DAYU_PROXY:-}
    HTTPS_PROXY: ${DAYU_PROXY:-}
    NO_PROXY: localhost,127.0.0.1,::1
    TZ: ${TZ:-Asia/Shanghai}
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  snow-xiaoyu:
    <<: *bot
    profiles: [xiaoyu]
    image: snow-xiaoyu:local
    build:
      context: .
      dockerfile: Dockerfile.snow-xiaoyu
      args:
        HTTP_PROXY: ${DAYU_PROXY:-}
        HTTPS_PROXY: ${DAYU_PROXY:-}
    working_dir: /opt/dayu
    volumes:
      - ./snow-xiaoyu/data:/opt/dayu/snow-xiaoyu/data:ro
    networks: [xiaoyu]
    environment:
      XIAOYU_QQ_APP_ID: ${XIAOYU_QQ_APP_ID:-}
      XIAOYU_QQ_APP_SECRET: ${XIAOYU_QQ_APP_SECRET:-}
      HTTP_PROXY: ${DAYU_PROXY:-}
      HTTPS_PROXY: ${DAYU_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,::1
      TZ: ${TZ:-Asia/Shanghai}
  snow-dayu:
    <<: *bot
    command: [snow-dayu]
    working_dir: ${SNOW_WORKSPACE:-/workspace}
    networks: [snow]
    environment:
      <<: *environment
      QQBOT_APPID: ${SNOW_QQ_APP_ID:-}
      QQBOT_SECRET: ${SNOW_QQ_APP_SECRET:-}
    volumes:
      - snow-state:/state
      - snow-work:${SNOW_WORKSPACE:-/workspace}
  chaifen-dayu:
    <<: *bot
    command: [chaifen-dayu]
    working_dir: ${CHAIFEN_WORKSPACE:-/workspace}
    networks: [chaifen]
    environment:
      <<: *environment
      QQBOT_APPID: ${CHAIFEN_QQ_APP_ID:-}
      QQBOT_SECRET: ${CHAIFEN_QQ_APP_SECRET:-}
    volumes:
      - chaifen-state:/state
      - chaifen-work:${CHAIFEN_WORKSPACE:-/workspace}
networks:
  xiaoyu: {}
  snow: {}
  chaifen: {}
volumes:
  snow-state: {}
  snow-work: {}
  chaifen-state: {}
  chaifen-work: {}
